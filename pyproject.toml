[project]
name = "end-to-end-block-sparse-featurizers"
version = "0.1.0"
description = "Reproducible output-KL training of block-sparse vision featurizers"
readme = "README.md"
authors = [
    { name = "Libor Burian" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.14.1,<2.15",
    "torchvision>=0.29.1,<0.30",
    "transformers>=5.21,<6",
    "huggingface-hub>=2.3,<3",
    "numpy>=2.5,<3",
    "scipy>=1.18,<2",
    "scikit-learn>=1.9,<2",
    "pillow>=12.3",
    "imagehash>=4.3.2",
    "python-dotenv>=1.2.4",
    "matplotlib>=3.10",
    "plotly>=7.1",
    "statsmodels>=0.15",
    "reportlab>=5.1",
    "pymupdf>=2.0",
    "einops>=0.8.2",
]

[project.scripts]
e2e-bsf = "e2e_bsf.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "e2e_bsf"

[dependency-groups]
dev = ["pytest>=9.1", "ruff>=0.14"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["gpu: real pretrained-model CUDA verification"]
